# 方塊

# 製造
block.more-extended-hot-disassembler.name=耐熱解離機
block.more-extended-hot-disassembler.description=以低效率將熔渣分離成微量的異星礦物成分。能產生釷，需要使用水冷卻。更加耐熱，可以在高溫高壓環境下使用。

block.more-extended-hot-separator.name=耐熱分離機
block.more-extended-hot-separator.description=將熔渣分離成礦物成分。需要使用水冷卻。更加耐熱，可以在高溫高壓環境下使用。

block.more-extended-iron-crafter.name=鐵冶煉廠
block.more-extended-iron-crafter.description=把粗鐵冶煉成鐵。

block.more-extended-scrap-crafter.name=廢料製造機
block.more-extended-scrap-crafter.description=用基礎資源製作廢料。

# 防禦
block.more-extended-iron-wall.name=鐵牆
block.more-extended-iron-wall.description=保護己方建築，擋下敵方砲彈。

# 環境
block.more-extended-ore-iron.name=鐵礦脈
block.more-extended-ore-iron.description=鐵礦脈。

# 邏輯
block.more-extended-hot-micro-processor.name=耐熱微型處理器
block.more-extended-hot-micro-processor.description=循環執行一系列邏輯指令，可用於控制單位和建築物。更加耐熱，可以在高溫高壓環境下使用。

# 電力
block.more-extended-hot-battery-large.name=耐熱大型電池
block.more-extended-hot-battery-large.description=儲存電網多餘電力，並在電網供電不足時放電。比普通電池容量更高。更加耐熱，可以在高溫高壓環境下使用。

block.more-extended-hot-battery.name=耐熱電池
block.more-extended-hot-battery.description=儲存電網多餘電力，並在電網供電不足時放電。更加耐熱，可以在高溫高壓環境下使用。

block.more-extended-hot-diode.name=耐熱二極體
block.more-extended-hot-diode.description=單向傳輸電力，僅當該方向上電力儲備較少時起作用。更加耐熱，可以在高溫高壓環境下使用。

block.more-extended-hot-power-node-large.name=耐熱大型電力節點
block.more-extended-hot-power-node-large.description=連接範圍更大的進階電力節點。更加耐熱，可以在高溫高壓環境下使用。

block.more-extended-hot-power-node.name=耐熱電力節點
block.more-extended-hot-power-node.description=向連接的其他節點傳輸電力，也能從相鄰的建築接收電力或向其供電。更加耐熱，可以在高溫高壓環境下使用。

block.more-extended-oil-power-generator.name=石油發電機
block.more-extended-oil-power-generator.description=燃燒石油發電。

# 生產
block.more-extended-end-drill.name=終極鑽頭
block.more-extended-end-drill.description=最終的鑽頭，開採速度極快。

block.more-extended-oil-drill.name=抽油機
block.more-extended-oil-drill.description=從地下提取石油，適用於附近沒有地表石油的情況。

block.more-extended-water-drill.name=水鑽井
block.more-extended-water-drill.description=輸入沙子和電力抽取地下水。

