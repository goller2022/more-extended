item.more-extended-crude-iron.name=粗鐵
item.more-extended-crude-iron.description=未冶煉的鐵。
item.more-extended-crude-iron.details=未冶煉的鐵，可直接從地上挖掘。

item.more-extended-iron.name=鐵
item.more-extended-iron.description=更好的材料。
item.more-extended-iron.details=在銅、鉛之後出現的材料，更堅硬。

# 星球
planet.more-extended-veridia.name=維里迪亞
planet.more-extended-veridia.description=一顆位於埃里克斯和瑟普羅軌道之間的行星，處於宜居帶，適合發展科技。