# Logic
block.more-extended-hot-micro-processor.name=Heat-resistant Micro Processor
block.more-extended-hot-micro-processor.description=Runs a sequence of logic instructions in a loop, used to control units and buildings. More heat-resistant, can be used in high-temperature and high-pressure environments.

# Power
block.more-extended-hot-battery-large.name=Heat-resistant Large Battery
block.more-extended-hot-battery-large.description=Stores excess power from the grid and discharges when power is insufficient. Has a higher capacity than standard batteries. More heat-resistant, can be used in high-temperature and high-pressure environments.

block.more-extended-hot-battery.name=Heat-resistant Battery
block.more-extended-hot-battery.description=Stores excess power from the grid and discharges when power is insufficient. More heat-resistant, can be used in high-temperature and high-pressure environments.

block.more-extended-hot-diode.name=Heat-resistant Diode
block.more-extended-hot-diode.description=Transmits power in one direction, only functions when power reserves in that direction are lower. More heat-resistant, can be used in high-temperature and high-pressure environments.

block.more-extended-hot-power-node-large.name=Heat-resistant Large Power Node
block.more-extended-hot-power-node-large.description=Advanced power node with a larger connection range. More heat-resistant, can be used in high-temperature and high-pressure environments.

block.more-extended-hot-power-node.name=Heat-resistant Power Node
block.more-extended-hot-power-node.description=Transmits power to connected nodes, and can also receive power from or supply power to adjacent buildings. More heat-resistant, can be used in high-temperature and high-pressure environments.

block.more-extended-oil-power-generator.name=Oil Generator
block.more-extended-oil-power-generator.description=Burns oil to generate power.

