# Blocks

# Crafting
block.more-extended-hot-disassembler.name=Heat-resistant Disassembler
block.more-extended-hot-disassembler.description=Separates slag into trace amounts of exotic mineral components at low efficiency. Can produce thorium. Requires water for cooling. More heat-resistant, can be used in high-temperature and high-pressure environments.

block.more-extended-hot-separator.name=Heat-resistant Separator
block.more-extended-hot-separator.description=Separates slag into mineral components. Requires water for cooling. More heat-resistant, can be used in high-temperature and high-pressure environments.

block.more-extended-iron-crafter.name=Iron Smelter
block.more-extended-iron-crafter.description=Smelts crude iron into iron.

block.more-extended-scrap-crafter.name=Scrap Fabricator
block.more-extended-scrap-crafter.description=Manufactures scrap from basic resources.

